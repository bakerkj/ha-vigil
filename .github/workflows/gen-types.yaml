name: gen-types

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Regenerate the frontend API types from the backend wire types and fail if the
# committed output is stale. Needs both envs: uv (pydantic + the HA-importing
# models) and node (json-schema-to-typescript).
jobs:
  gen-types:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-suffix: gen-types
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - run: npm ci
      - name: Install the locked environment
        run: uv sync --group dev --frozen
      - run: uv run --no-sync python scripts/gen_frontend_types.py
      - name: Fail if the generated frontend types are stale
        run: >-
          git diff --exit-code --
          custom_components/vigil/frontend/vigil-api.generated.d.ts
