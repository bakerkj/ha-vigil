name: gen-types

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Regenerate the frontend API types from the backend wire types and fail if the
# committed output is stale. Needs both envs: uv (pydantic + the HA-importing
# models) and node (json-schema-to-typescript).
jobs:
  gen-types:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-suffix: gen-types
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci
      - run: uv run python scripts/gen_frontend_types.py
      - name: Fail if the generated frontend types are stale
        run: >-
          git diff --exit-code --
          custom_components/vigil/frontend/vigil-api.generated.d.ts
